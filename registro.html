<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formulario_Práctica8_AOOM_0605</title>
	<link rel="stylesheet" href="formularioestilo.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
	awesome/7.3.1/css/all.min.css">
</head>
<body style="background-color: white;">
	<header>
		<a style="padding-left: 1.3%;" class="bt" href="index.html">VOLVER</a>
	</header>
	<div style="padding-left: 30%; padding-right: 30%;">
		<div class="form">
			<h3 style="text-align: center; font-size: 150%;">Crea tu Cuenta</h3>
			<form action="" method="post">
				<legend style="font-weight: bold; padding-bottom: 5%; padding-top: 5%;">Datos de Registro</legend>
				<div style="text-align: center; display: flex; flex-direction: column; align-items: center;">
					Nombre y Apellido:
					<input type="text" name="nompellido" class="bto">
				</div>
				<br><br>
				<div style="text-align: center; display: flex; flex-direction: column; align-items: center;">
					Fecha de nacimiento:
					<input type="date" name="fecha_nacimiento" class="bto">
				</div>
				<br><br>
				<div style="text-align: center; display: flex; flex-direction: column; align-items: center;">
					Correo electrónico:
					<input type="text" name="correo" class="bto">
				</div>
				<br><br>
				<div style="text-align: center; display: flex; flex-direction: column; align-items: center;">
					Nombre de usuario:
					<input type="text" name="usuario" class="bto">
				</div>
				<br><br>
				<div style="text-align: center; display: flex; flex-direction: column; align-items: center;">
					Contraseña:
					<input type="password" name="contraseña" class="bto">
				</div>
				<br><br>
				<div style="text-align: center; display: flex; flex-direction: column; align-items: center;">
					Confirmar contraseña:
					<input type="password" name="contraseña" class="bto">
				</div>
				<br><br>
				<div style="text-align: center; display: flex; align-items: center;">
					<button type="submit" class="bto" style="width: 260px; background-color: black; color: white;">Continuar </button>
				</div>
			</form>
		</div>
			
		
	</div>
		
	<footer style="padding-left: 2%; text-align: left; padding-top: 5%;"><h3>Ogaz Maravillo Angel Omar 5°I</h3></footer>
</body>
</html>
